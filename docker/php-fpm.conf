[www]
listen = 9000
pm = dynamic
; Sized to the host's RAM through FPM_MAX_CHILDREN (about 80 MB per worker).
pm.max_children = ${FPM_MAX_CHILDREN}
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 4
pm.max_requests = 500
ping.path = /ping
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
