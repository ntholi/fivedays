; Moodle settings for both php-fpm and the CLI (migrate, cron).
memory_limit = 256M
max_execution_time = 300
max_input_vars = 5000
; maxbytes is 20 MB (config.php); Caddy allows a 25 MB body for the multipart envelope.
upload_max_filesize = 21M
post_max_size = 25M
file_uploads = On
expose_php = Off
zend.exception_ignore_args = On

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 32531
; The image is immutable, so prod skips file checks; compose.dev.yaml sets PHP_OPCACHE_VALIDATE=1 for live plugin edits.
opcache.validate_timestamps = ${PHP_OPCACHE_VALIDATE}
opcache.revalidate_freq = 0
