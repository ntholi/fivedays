# The old host's Moodle site: certbot-style TLS on 443 (here a self-signed certificate for the stand-in's
# domain, written by after-up), web root public/, PHP through php8.3-fpm. $CFG->slasharguments is false.
server {
    listen 80 default_server;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    ssl_certificate /etc/ssl/standin/site.crt;
    ssl_certificate_key /etc/ssl/standin/site.key;
    root /var/www/html/sites/moodle/public;
    index index.php;
    client_max_body_size 25M;

    location ~ /\. { return 404; }
    location / { try_files $uri $uri/ /r.php$is_args$args; }
    location ~ [^/]\.php(/|$) {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_index index.php;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        include fastcgi_params;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300;
    }
}
